name: Veille PNC

on:
  schedule:
    # Toutes les 15 min, en évitant les heures pile (où GitHub retarde les exécutions).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Ne traiter qu'une source (son id, ex. transavia). Laisser vide pour tout lancer."
        required: false
        default: ""
      dry_run:
        description: "Essai à blanc : aucune notification, aucun enregistrement"
        type: boolean
        default: false
      weekly:
        description: "Envoyer aussi le résumé hebdomadaire maintenant"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veille-pnc
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      INPUT_SOURCE: ${{ inputs.source }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_WEEKLY: ${{ inputs.weekly }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Arguments
        id: args
        run: |
          selection=""
          if [ -n "$INPUT_SOURCE" ]; then
            if ! [[ "$INPUT_SOURCE" =~ ^[a-z0-9_]+$ ]]; then echo "id de source invalide" >&2; exit 1; fi
            selection="--source $INPUT_SOURCE"
          fi
          run="$selection"
          if [ "$INPUT_DRY_RUN" = "true" ]; then run="$run --dry-run"; fi
          if [ "$INPUT_WEEKLY" = "true" ]; then run="$run --weekly"; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "browser=$(python -m veille --needs-browser $selection)" >> "$GITHUB_OUTPUT"

      # Playwright n'est installé que si une source activée en a besoin.
      - name: Cache du navigateur Playwright
        if: steps.args.outputs.browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-browser.txt') }}

      - name: Playwright
        if: steps.args.outputs.browser == 'true'
        run: |
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps --only-shell chromium

      - name: Veille
        env:
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m veille ${{ steps.args.outputs.run }}

      # L'état n'est commité que s'il a changé (au moins une fois par semaine grâce au « heartbeat »).
      # Ces commits évitent aussi la désactivation des workflows programmés après 60 jours sans activité.
      - name: Enregistrer l'état
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "État inchangé : pas de commit."
            exit 0
          fi
          git commit -m "chore(état): mise à jour de la veille [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
