<!doctype html><html><head><title>Air Caraïbes - Attaché(e) commercial - CDD - Saint-Martin</title><script data-rh="true" type="application/ld+json">{"@context":"https://schema.org/","@type":"JobPosting","title":"Attaché(e) commercial","description":"\u003ch3\u003eDescription du poste et Missions\u003c/h3\u003e\u003cbr/\u003e\u003cp\u003eL’attaché(e) commercial est sous la responsabilité de la direction commerciale Antilles-Guyane. Il/elle veille au standard de la qualité du service clientèle. Il/elle s’assure que toutes les pratiques et procédures mises en œuvre sont conformes aux politiques et aux réglementations qui régissent le transport aérien, y compris celles de la compagnie.\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e\u003cu\u003eMissions spécifiques :\u003c/u\u003e\u003c/strong\u003e\u003cbr /\u003e\u003cbr /\u003e- Prospecter et visiter la clientèle selon un planning validé et communiqué\u003cbr /\u003e- Conseiller et vendre nos produits à la clientèle\u003cbr /\u003e- Fidéliser les clients existants par un suivi régulier de leurs besoins\u003cbr /\u003e- Proposer et négocier des accords commerciaux auprès des différents types de clientèle (Particuliers, professionnels, entreprises, administrations, association)\u003cbr /\u003e- Appliquer les plans d’actions commerciales définies\u003cbr /\u003e- Préparer et diffuser les contrats, les fiches techniques produits et toutes informations commerciales\u003cbr /\u003e- Assister et participer aux réunions de travail de son service\u003cbr /\u003e- Animer le réseau d’AGV, informer et former ses revendeurs sur nos différents produits\u003cbr /\u003e- Assister les AGV, informer et former ses revendeurs sur nos différents produits\u003cbr /\u003e- Tenir à jour ses résultats de ventes (réalisations/objectifs) ainsi que les bases de données liées à son activité\u003cbr /\u003e- Effectuer une veille concurrentielle permanente\u003cbr /\u003e- Rendre compte, rédiger et diffuser un rapport mensuel d’activité\u003cbr /\u0
